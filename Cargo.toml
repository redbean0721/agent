[package]
name = "taiwanfrp"
version = "0.1.0"
edition = "2024"
description = "An FRP agent for TaiwanFRP"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
sys-locale = "0.3.2"
toml = "1.1.5"
keyring = "4.2.0"
rpassword = "7.5.4"
colored = "3.1.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
sha2 = "0.11.0"
hex = "0.4.3"
zip = "9.0.0-pre3"
log = "0.4.34"
env_logger = "0.11.11"
ctrlc = "3.5.2"
self_update = { version = "1.3.0", default-features = false, features = [
    "ureq",
    "rustls",
    "github",
    "progress-bar",
] }

[target.'cfg(windows)'.dependencies]
goblin = "0.10.7"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Threading", "Win32_Security", "Win32_Foundation","Win32_System_Memory",
    "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader",
    "Win32_System_JobObjects", "Win32_System_SystemInformation"
] }

[profile.release]
strip = true
