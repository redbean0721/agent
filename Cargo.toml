[package]
name = "taiwanfrp"
version = "0.1.0"
edition = "2024"
description = "An FRP agent for TaiwanFRP"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
sys-locale = "0.3.2"
toml = "1.1.5"
keyring = "4.2.0"
rpassword = "7.5.4"
colored = "3.1.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
sha2 = "0.11.0"
hex = "0.4.3"
zip = "9.0.0-pre3"

[profile.release]
strip = true